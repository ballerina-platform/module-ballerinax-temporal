import org.gradle.api.attributes.java.TargetJvmEnvironment
import org.apache.tools.ant.taskdefs.condition.Os

plugins {
    id 'io.ballerina.plugin'
}

description = 'Ballerina - Temporal Ballerina'

def packageName = "temporal"
def packageOrg = "ballerinax"
def tomlVersion = stripBallerinaExtensionVersion("${project.version}")
def ballerinaTomlFilePlaceHolder = new File("${project.rootDir}/build-config/resources/Ballerina.toml")
def ballerinaTomlFile = new File("$project.projectDir/Ballerina.toml")

def stripBallerinaExtensionVersion(String extVersion) {
    if (extVersion.matches(project.ext.timestampedVersionRegex)) {
        def splitVersion = extVersion.split('-')
        if (splitVersion.length > 3) {
            def strippedValues = splitVersion[0..-4]
            return strippedValues.join('-')
        } else {
            return extVersion
        }
    } else {
        return extVersion.replace("${project.ext.snapshotVersion}", "")
    }
}

configurations {
    externalJars {
        canBeResolved = true
        canBeConsumed = false
        attributes {
            attribute(TargetJvmEnvironment.TARGET_JVM_ENVIRONMENT_ATTRIBUTE, 
                objects.named(TargetJvmEnvironment, TargetJvmEnvironment.STANDARD_JVM))
        }
    }
}

dependencies {
    externalJars(group: 'io.temporal', name: 'temporal-sdk', version: "${temporalSdkVersion}") {
        transitive = false
    }
    externalJars(group: 'io.temporal', name: 'temporal-serviceclient', version: "${temporalServiceclientVersion}") {
        transitive = false
    }
    externalJars(group: 'io.grpc', name: 'grpc-api', version: "${grpcVersion}") {
        transitive = false
    }
    externalJars(group: 'io.grpc', name: 'grpc-context', version: "${grpcVersion}") {
        transitive = false
    }
    externalJars(group: 'io.grpc', name: 'grpc-stub', version: "${grpcVersion}") {
        transitive = false
    }
    externalJars(group: 'io.grpc', name: 'grpc-protobuf', version: "${grpcVersion}") {
        transitive = false
    }
    externalJars(group: 'io.grpc', name: 'grpc-protobuf-lite', version: "${grpcVersion}") {
        transitive = false
    }
    externalJars(group: 'io.grpc', name: 'grpc-core', version: "${grpcVersion}") {
        transitive = false
    }
    externalJars(group: 'io.grpc', name: 'grpc-netty-shaded', version: "${grpcVersion}") {
        transitive = false
    }
    externalJars(group: 'io.grpc', name: 'grpc-services', version: "${grpcVersion}") {
        transitive = false
    }
    externalJars(group: 'com.google.protobuf', name: 'protobuf-java', version: "${protobufVersion}") {
        transitive = false
    }
    externalJars(group: 'com.google.protobuf', name: 'protobuf-java-util', version: "${protobufVersion}") {
        transitive = false
    }
    externalJars(group: 'com.fasterxml.jackson.core', name: 'jackson-core', version: "${jacksonVersion}") {
        transitive = false
    }
    externalJars(group: 'com.fasterxml.jackson.core', name: 'jackson-annotations', version: "${jacksonVersion}") {
        transitive = false
    }
    externalJars(group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: "${jacksonVersion}") {
        transitive = false
    }
    externalJars(group: 'com.fasterxml.jackson.datatype', name: 'jackson-datatype-jsr310', version: "${jacksonVersion}") {
        transitive = false
    }
    externalJars(group: 'com.fasterxml.jackson.datatype', name: 'jackson-datatype-jdk8', version: "${jacksonVersion}") {
        transitive = false
    }
    externalJars(group: 'com.uber.m3', name: 'tally-core', version: "${tallyVersion}") {
        transitive = false
    }
    externalJars(group: 'com.google.guava', name: 'guava', version: "${guavaVersion}") {
        transitive = false
    }
    externalJars(group: 'com.google.guava', name: 'failureaccess', version: "${failureaccessVersion}") {
        transitive = false
    }
    externalJars(group: 'io.perfmark', name: 'perfmark-api', version: "${perfmarkVersion}") {
        transitive = false
    }
}

task copyExternalJars(type: Copy) {
    from configurations.externalJars
    into "$project.projectDir/lib"
}

ballerina {
    packageOrganization = packageOrg
    module = packageName
    langVersion = ballerinaLangVersion
    testCoverageParam = "--code-coverage --coverage-format=xml --includes=io.ballerina.stdlib.temporal.*:ballerina.temporal*"
}

clean {
    delete "$project.projectDir/lib"
}

task updateTomlFiles {
    doLast {
        def newBallerinaToml = ballerinaTomlFilePlaceHolder.text.replace("@project.version@", project.version)
        newBallerinaToml = newBallerinaToml.replace("@toml.version@", tomlVersion)
        newBallerinaToml = newBallerinaToml.replace("@temporal.sdk.version@", temporalSdkVersion)
        newBallerinaToml = newBallerinaToml.replace("@temporal.serviceclient.version@", temporalServiceclientVersion)
        newBallerinaToml = newBallerinaToml.replace("@grpc.version@", grpcVersion)
        newBallerinaToml = newBallerinaToml.replace("@protobuf.version@", protobufVersion)
        newBallerinaToml = newBallerinaToml.replace("@jackson.version@", jacksonVersion)
        newBallerinaToml = newBallerinaToml.replace("@tally.version@", tallyVersion)
        newBallerinaToml = newBallerinaToml.replace("@guava.version@", guavaVersion)
        newBallerinaToml = newBallerinaToml.replace("@failureaccess.version@", failureaccessVersion)
        newBallerinaToml = newBallerinaToml.replace("@perfmark.version@", perfmarkVersion)
        ballerinaTomlFile.text = newBallerinaToml
    }
}

task commitTomlFiles {
    doLast {
        project.exec {
            ignoreExitValue true
            commandLine 'sh', '-c', "git commit -m '[Automated] Update the native jar versions' Ballerina.toml Dependencies.toml"
        }
    }
}

task startTemporalServer {
    doLast {
        if (Os.isFamily(Os.FAMILY_WINDOWS)) {
            exec {
                workingDir "${project.rootDir}/ballerina-tests"
                commandLine 'cmd', '/c', "docker-compose -f resources/docker-compose.yml up -d"
            }
        } else {
            exec {
                workingDir "${project.rootDir}/ballerina-tests"
                commandLine 'sh', '-c', "docker-compose -f resources/docker-compose.yml up -d"
            }
        }
        
        // Wait for Temporal server to be ready with retry loop
        def maxRetries = 30
        def retryCount = 0
        def isReady = false
        
        while (retryCount < maxRetries && !isReady) {
            try {
                if (Os.isFamily(Os.FAMILY_WINDOWS)) {
                    def result = exec {
                        commandLine 'cmd', '/c', 'netstat -an | findstr "7233.*LISTENING"'
                        ignoreExitValue true
                    }
                    isReady = result.exitValue == 0
                } else {
                    def result = exec {
                        commandLine 'sh', '-c', 'netstat -tlnp 2>/dev/null | grep ":7233" || ss -tlnp 2>/dev/null | grep ":7233" || lsof -i :7233 2>/dev/null'
                        ignoreExitValue true
                    }
                    isReady = result.exitValue == 0
                }
                
                if (!isReady) {
                    println "Waiting for Temporal server to start... (attempt ${retryCount + 1}/${maxRetries})"
                    Thread.sleep(2000)
                    retryCount++
                }
            } catch (Exception e) {
                println "Error checking Temporal server status: ${e.message}"
                Thread.sleep(2000)
                retryCount++
            }
        }
        
        if (!isReady) {
            throw new GradleException("Temporal server failed to start after ${maxRetries} attempts")
        }
        
        println "Temporal server is ready!"
    }
}

task stopTemporalServer {
    doLast {
        if (Os.isFamily(Os.FAMILY_WINDOWS)) {
            exec {
                workingDir "${project.rootDir}/ballerina-tests"
                commandLine 'cmd', '/c', "docker-compose -f resources/docker-compose.yml down"
                ignoreExitValue true
            }
        } else {
            exec {
                workingDir "${project.rootDir}/ballerina-tests"
                commandLine 'sh', '-c', "docker-compose -f resources/docker-compose.yml down"
                ignoreExitValue true
            }
        }
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            artifact source: createArtifactZip, extension: 'zip'
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/ballerina-platform/module-${packageOrg}-${packageName}")
            credentials {
                username = System.getenv("publishUser")
                password = System.getenv("publishPAT")
            }
        }
    }
}

updateTomlFiles.dependsOn copyStdlibs

build.dependsOn copyExternalJars
build.dependsOn "generatePomFileForMavenPublication"
build.dependsOn ":${packageName}-native:build"

test.dependsOn startTemporalServer
test.dependsOn ":${packageName}-native:build"
test.finalizedBy stopTemporalServer
test.onlyIf { project.hasProperty('runMainModuleTests') }
startTemporalServer.onlyIf { project.hasProperty('runMainModuleTests') }
stopTemporalServer.onlyIf { project.hasProperty('runMainModuleTests') }

publishToMavenLocal.dependsOn build
publish.dependsOn build