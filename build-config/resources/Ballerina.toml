[package]
org = "ballerinax"
name = "temporal"
version = "@toml.version@"
authors = ["Ballerina"]
keywords = ["temporal", "workflow", "orchestration"]
repository = "https://github.com/ballerina-platform/module-ballerinax-temporal"
license = ["Apache-2.0"]
distribution = "2201.13.0"

[build-options]
observabilityIncluded = true

[platform.java21]
graalvmCompatible = true

[[dependency]]
org = "ballerina"
name="workflow"
version="0.1.0"
repository="local"

[[platform.java21.dependency]]
path = "../native/build/libs/temporal-native-@project.version@.jar"
groupId = "io.ballerina.stdlib"
artifactId = "temporal-native"
version = "@project.version@"

[[platform.java21.dependency]]
path = "./lib/temporal-sdk-@temporal.sdk.version@.jar"

[[platform.java21.dependency]]
path = "./lib/temporal-serviceclient-@temporal.serviceclient.version@.jar"

[[platform.java21.dependency]]
path = "./lib/grpc-api-@grpc.version@.jar"

[[platform.java21.dependency]]
path = "./lib/grpc-context-@grpc.version@.jar"

[[platform.java21.dependency]]
path = "./lib/grpc-stub-@grpc.version@.jar"

[[platform.java21.dependency]]
path = "./lib/grpc-protobuf-@grpc.version@.jar"

[[platform.java21.dependency]]
path = "./lib/grpc-protobuf-lite-@grpc.version@.jar"

[[platform.java21.dependency]]
path = "./lib/grpc-core-@grpc.version@.jar"

[[platform.java21.dependency]]
path = "./lib/grpc-netty-shaded-@grpc.version@.jar"

[[platform.java21.dependency]]
path = "./lib/grpc-services-@grpc.version@.jar"

[[platform.java21.dependency]]
path = "./lib/protobuf-java-@protobuf.version@.jar"

[[platform.java21.dependency]]
path = "./lib/protobuf-java-util-@protobuf.version@.jar"

[[platform.java21.dependency]]
path = "./lib/jackson-core-@jackson.version@.jar"

[[platform.java21.dependency]]
path = "./lib/jackson-annotations-@jackson.version@.jar"

[[platform.java21.dependency]]
path = "./lib/jackson-databind-@jackson.version@.jar"

[[platform.java21.dependency]]
path = "./lib/jackson-datatype-jsr310-@jackson.version@.jar"

[[platform.java21.dependency]]
path = "./lib/jackson-datatype-jdk8-@jackson.version@.jar"

[[platform.java21.dependency]]
path = "./lib/tally-core-@tally.version@.jar"

[[platform.java21.dependency]]
path = "./lib/guava-@guava.version@.jar"

[[platform.java21.dependency]]
path = "./lib/failureaccess-@failureaccess.version@.jar"

[[platform.java21.dependency]]
path = "./lib/perfmark-api-@perfmark.version@.jar"